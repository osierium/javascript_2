<body>
<script>

    let num1 = parseInt(prompt('Inserisci il primo numero:'))
    let num2 = parseInt(prompt('Inserisci il secondo numero:'))

    let sum = num1 + num2;
    let subtraction = num1 - num2;
    let multiplication = num1 * num2;
    let division = num1 / num2;
    let exponention = num1 ** num2;

    console.log("Con i numeri da te scelti, i risultati delle varie operazioni sono:")

    console.log(`somma = ${sum}, sottrazione = ${subtraction}, moltiplicazione =${multiplication}, divisione = ${division},$potenza = ${exponention}`)

</script>
